name: Build Desktop (Dev)

# Auto-builds a side-by-side "NuvioDev" Windows installer on every push to Dev.
# It uses a distinct package name and MSI upgrade UUID so it installs next to the
# official Nuvio app instead of colliding with it. Backend secrets are optional:
# if NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 is not configured the build still
# produces an installable MSI (with online features disabled).

on:
  push:
    branches:
      - Dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 MSI (NuvioDev)
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      NUVIO_DEV_PACKAGE_NAME: NuvioDev
      # A UUID distinct from the official app's upgrade UUID so the two can be installed side by side.
      NUVIO_DEV_UPGRADE_UUID: 7a2f1c94-2d63-4b6e-9c1d-4f8b7a0e2d31

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Fetch Windows runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]]; then
            echo "The bundled Windows libmpv runtime is missing." >&2
            exit 1
          fi
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure local.properties
        shell: bash
        run: |
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            echo "NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 is not set; building with online features disabled."
            touch local.properties
          fi

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache

          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $loaderLibrary = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $loaderLibrary)) {
            throw "WebView2Loader.dll.lib was not found at $loaderLibrary"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Read version
        shell: pwsh
        run: |
          $props = Get-Content "composeApp/Configuration/DesktopVersion.properties"
          $name = ($props | Where-Object { $_ -match '^VERSION_NAME=' }) -replace '^VERSION_NAME=', ''
          "RELEASE_VERSION=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pnuvio.desktop.packageName=$env:NUVIO_DEV_PACKAGE_NAME" `
            "-Pnuvio.desktop.upgradeUuid=$env:NUVIO_DEV_UPGRADE_UUID" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace

      - name: Verify MSI
        shell: pwsh
        run: |
          $expected = "composeApp\build\compose\release-msis\$env:NUVIO_DEV_PACKAGE_NAME-Windows-x64-$env:RELEASE_VERSION.msi"
          if (-not (Test-Path $expected)) {
            throw "Expected MSI was not produced: $expected"
          }
          Get-Item $expected | Format-List Name, Length, LastWriteTime

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-dev-windows-x64
          path: composeApp/build/compose/release-msis/*.msi
          if-no-files-found: error
          retention-days: 14