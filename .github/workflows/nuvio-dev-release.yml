name: Release NuvioDev

# Builds and publishes NuvioDev releases: Windows MSI, Linux AppImage and
# Android APKs. Releases are tagged "NuvioDev-v<version>" and a rolling
# "NuvioDev Latest" release is kept so the in-app updater can find the newest
# build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Override version (defaults to composeApp/Configuration/DesktopVersion.properties)
        required: false
        type: string
  push:
    branches:
      - Dev
    tags:
      - "*"

permissions:
  contents: write

# Pushes to Dev publish a rolling "latest" release (used by the in-app updater);
# pushing a version tag (e.g. "0.1") publishes a versioned release as well.
concurrency:
  group: nuvio-dev-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NUVIO_DEV_PACKAGE_NAME: NuvioDev
  NUVIO_DEV_UPGRADE_UUID: 7a2f1c94-2d63-4b6e-9c1d-4f8b7a0e2d31
  LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}

jobs:
  metadata:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      rolling_version: ${{ steps.version.outputs.rolling_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "${version}" ]; then
            version="$(grep -E '^VERSION_NAME=' composeApp/Configuration/DesktopVersion.properties | cut -d= -f2 | tr -d '[:space:]')"
          fi
          [ -n "${version}" ] || { echo "Could not resolve version." >&2; exit 1; }
          # Append a monotonic run number so the in-app updater sees each Dev
          # build as newer than the last. Keep any prerelease suffix
          # (e.g. "0.2-alpha" -> "0.2-alpha.<run>").
          if [[ "${version}" == *-* ]]; then
            core="${version%%-*}"
            suffix="${version#*-}"
            rolling_version="${core}-${suffix}.${{ github.run_number }}"
          else
            rolling_version="${version}.${{ github.run_number }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "rolling_version=${rolling_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Linux native build deps
        shell: bash
        # The desktop JVM target pulls in composeMediaPlayer, whose Linux
        # native player is built with CMake against gstreamer.
        run: sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure local.properties
        shell: bash
        run: |
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            touch local.properties
          fi
      - name: Run desktop unit tests
        shell: bash
        # Compiles every test source, then runs the deterministic suites
        # covering updater, debrid, profiles and tracking logic. The full
        # desktopTest suite still has ~30 pre-existing headless-environment
        # failures (Compose UI / native player tests) that would block every
        # release, so only the deterministic packages gate the release here.
        # Linux native player bridges are runtime-only artifacts and skipped.
        run: >-
          ./gradlew :composeApp:desktopTest
          -x :composeApp:buildLinuxPlayerBridge
          -x :composeMediaPlayer:buildNativeLinux
          --tests "com.nuvio.app.features.updater.*"
          --tests "com.nuvio.app.features.debrid.*"
          --tests "com.nuvio.app.features.profiles.*"
          --tests "com.nuvio.app.features.trakt.*"
          --no-configuration-cache --stacktrace

  windows:
    name: Windows x64
    needs: metadata
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      NUVIO_DESKTOP_VERSION_NAME: ${{ needs.metadata.outputs.rolling_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Fetch Windows runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          test -f composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # JDK 21+: its jpackage generates MSI component GUIDs per product.
          # JDK 17-derived GUIDs collide with other jpackage apps (e.g. the
          # official Nuvio MSI), and installing either app removes the other's
          # identically-named files, leaving a launcher that silently fails.
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure local.properties
        shell: bash
        run: |
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            touch local.properties
          fi
      - name: Validate local.properties
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s local.properties ]]; then
            echo "::error::local.properties is empty - the NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 secret is missing or invalid. Auth and tracking config would be baked in blank (sign-in fails with connection refused)."
            exit 1
          fi
          for key in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TRAKT_CLIENT_ID SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            if ! grep -Eq "^${key}=..+" local.properties; then
              echo "::error::local.properties is missing ${key} - re-encode and update the NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 secret."
              exit 1
            fi
          done
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          $root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pnuvio.desktop.packageName=$env:NUVIO_DEV_PACKAGE_NAME" `
            "-Pnuvio.desktop.upgradeUuid=$env:NUVIO_DEV_UPGRADE_UUID" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache --no-daemon --stacktrace
      - name: Collect artifact
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.rolling_version }}
        run: |
          mkdir -p out
          # jpackage rewrites the version to a numeric x.y.z, so locate the
          # produced MSI by glob instead of predicting the filename.
          msi="$(find composeApp/build/compose/release-msis -maxdepth 1 -name '*.msi' | head -n1)"
          if [ -z "${msi}" ]; then
            echo "No MSI produced." >&2
            find composeApp/build/compose -name '*.msi' >&2 || true
            exit 1
          fi
          cp "${msi}" "out/NuvioDev-${VERSION}-windows-x64.msi"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-dev-windows-x64
          path: out/*.msi
          if-no-files-found: error

  linux:
    name: Linux x64 AppImage
    needs: metadata
    runs-on: ubuntu-latest
    env:
      NUVIO_DESKTOP_VERSION_NAME: ${{ needs.metadata.outputs.rolling_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: bash ./scripts/linux/install-desktop-build-dependencies.sh
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure local.properties
        shell: bash
        run: |
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            touch local.properties
          fi
      - name: Validate local.properties
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s local.properties ]]; then
            echo "::error::local.properties is empty - the NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 secret is missing or invalid."
            exit 1
          fi
          for key in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TRAKT_CLIENT_ID SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            if ! grep -Eq "^${key}=..+" local.properties; then
              echo "::error::local.properties is missing ${key}."
              exit 1
            fi
          done
      - name: Build AppImage
        shell: bash
        env:
          APPIMAGE_TOOL_VERSION: 1.9.1
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          set -euo pipefail
          appimagetool_path="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          curl -fsSL -o "${appimagetool_path}" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGE_TOOL_VERSION}/appimagetool-x86_64.AppImage"
          actual_sha256="$(sha256sum "${appimagetool_path}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${APPIMAGETOOL_SHA256}" ]]; then
            echo "appimagetool checksum mismatch." >&2
            echo "Expected: ${APPIMAGETOOL_SHA256}" >&2
            echo "Actual:   ${actual_sha256}" >&2
            exit 1
          fi
          chmod +x "${appimagetool_path}"
          # No -Pnuvio.desktop.packageName: the internal binary must stay
          # "Nuvio" so the generated AppRun script finds bin/Nuvio. The
          # artifact is renamed to NuvioDev-* in the collect step below.
          export APPIMAGETOOL="${appimagetool_path}"
          ./gradlew :composeApp:packageReleaseAppImage \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache --no-daemon --stacktrace
      - name: Collect artifact
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.rolling_version }}
        run: |
          set -euo pipefail
          mkdir -p out
          src="composeApp/build/compose/release-appimages/Nuvio-Linux-x86_64-${VERSION}.AppImage"
          if [[ ! -f "${src}" ]]; then
            echo "Expected AppImage at ${src}." >&2
            find composeApp/build/compose -name '*.AppImage' >&2 || true
            exit 1
          fi
          cp "${src}" "out/NuvioDev-Linux-x86_64-${VERSION}.AppImage"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-dev-linux-x64
          path: out/*.AppImage
          if-no-files-found: error

  android:
    name: Android APKs
    needs: metadata
    runs-on: ubuntu-latest
    # The vendored Enhanced project is a separate Gradle build with a cold
    # cache and R8 over several ABI splits, so give it plenty of headroom.
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.metadata.outputs.rolling_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # JDK 17: the proven mobile-release toolchain (see the upstream
          # android-release.yml workflow).
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure local.properties
        shell: bash
        run: |
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          cp local.properties nuvio-enhanced/local.properties
      - name: Validate local.properties
        shell: bash
        run: |
          set -euo pipefail
          for key in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TRAKT_CLIENT_ID SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            if ! grep -Eq "^${key}=..+" nuvio-enhanced/local.properties; then
              echo "::error::local.properties is missing ${key} - the Android APK would bake in blank auth config."
              exit 1
            fi
          done
      - name: Build full release APKs
        shell: bash
        # The Android app is NuvioMobile-Enhanced, vendored under
        # nuvio-enhanced/ as a self-contained Gradle project so the desktop
        # build (which shares the root composeApp) is never involved.
        working-directory: nuvio-enhanced
        # No release keystore is configured for this fork, so the build falls
        # back to the debug keystore (androidApp/build.gradle.kts) which keeps
        # the APK installable for sideloading. ABI splits produce one APK per
        # architecture.
        run: |
          set -euo pipefail
          # The vendored copy was committed from Windows, so gradlew lost its
          # executable bit.
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullRelease --no-configuration-cache --no-daemon --stacktrace
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          for apk in nuvio-enhanced/androidApp/build/outputs/apk/full/release/*.apk; do
            base="$(basename "${apk}")"
            abi="$(echo "${base}" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86' | head -n1 || true)"
            if [[ -n "${abi}" ]]; then
              cp "${apk}" "out/NuvioDev-${VERSION}-android-${abi}.apk"
            else
              cp "${apk}" "out/NuvioDev-${VERSION}-android-universal.apk"
            fi
          done
          if ! compgen -G "out/*.apk" >/dev/null; then
            echo "No APKs produced." >&2
            find nuvio-enhanced/androidApp/build/outputs -name '*.apk' >&2 || true
            exit 1
          fi
          ls -la out
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-dev-android
          path: out/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    # Best-effort extras: the release waits for the linux/android jobs so
    # their artifacts get attached when they succeed, but a Linux or Android
    # failure never blocks the Windows release or tests from publishing.
    needs: [metadata, windows, tests, linux, android]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      ROLLING_VERSION: ${{ needs.metadata.outputs.rolling_version }}
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Assemble release notes
        run: |
          set -euo pipefail
          {
            echo "## What's new in ${VERSION}"
            echo
            echo "- **Android app is now NuvioMobile-Enhanced** (version 0.4). It installs alongside the official Nuvio Enhanced app."
            echo "- Desktop unchanged: Windows MSI, Linux AppImage and macOS builds are the same NuvioDev app as before."
            echo
            echo "### Downloads"
            echo
            echo "- **Windows:** \`.msi\` installer (or the portable zip)"
            echo "- **Linux:** \`.AppImage\`"
            echo "- **Android:** sideload APK - uninstall the official Nuvio Enhanced app first if it is installed"
            echo
            echo "### Notes"
            echo
            echo "- NuvioDev installs next to the official Nuvio desktop app (separate app, shortcuts and menu entry)."
            echo "- In-app updates: **Settings -> About -> Check for updates**."
            echo
            echo "_Unofficial personal fork. Credit to Tapframe and the Nuvio contributors._"
          } > release-notes.md
          cat release-notes.md

      - name: Create or update versioned release
        run: |
          set -euo pipefail
          # A versioned (prerelease) release per Dev build gives history and
          # rollback; the rolling release below always points at the newest.
          # Assets are uploaded separately with --clobber: uploading during
          # "gh release create" is not idempotent (a retried asset upload
          # fails with "ReleaseAsset.name already exists").
          if gh release view "${ROLLING_VERSION}" >/dev/null 2>&1; then
            gh release edit "${ROLLING_VERSION}" \
              --title "NuvioDev ${ROLLING_VERSION}" --notes-file release-notes.md
          else
            gh release create "${ROLLING_VERSION}" \
              --title "NuvioDev ${ROLLING_VERSION}" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
          fi
          upload_with_retry() {
            local tag="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh release upload "${tag}" dist/* --clobber; then
                return 0
              fi
              echo "Asset upload attempt ${attempt} failed for ${tag}; retrying..." >&2
              sleep 10
            done
            return 1
          }
          upload_with_retry "${ROLLING_VERSION}"

      - name: Refresh rolling latest release
        run: |
          set -euo pipefail
          # The rolling release title carries the monotonic version so the
          # in-app updater treats every Dev build as newer than the last.
          # Remove every existing asset first: older builds used different
          # filenames, so matching by new names would leave stale ones behind.
          if gh release view nuvio-dev-latest >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nuvio-dev-latest" \
              --jq '.assets[].id' | while read -r id; do
                [ -n "${id}" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" || true
              done
            gh release edit nuvio-dev-latest --title "NuvioDev ${ROLLING_VERSION}" --notes-file release-notes.md --latest
          else
            gh release create nuvio-dev-latest \
              --title "NuvioDev ${ROLLING_VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi
          upload_with_retry() {
            local tag="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh release upload "${tag}" dist/* --clobber; then
                return 0
              fi
              echo "Asset upload attempt ${attempt} failed for ${tag}; retrying..." >&2
              sleep 10
            done
            return 1
          }
          upload_with_retry nuvio-dev-latest