# Dependency updates: Gradle libraries and workflow actions.
# Only weekly; releases gate on tests, so updates cannot silently break the build.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose:
        patterns:
          - "org.jetbrains.compose*"
          - "org.jetbrains.compose.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
